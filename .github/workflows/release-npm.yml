name: Release npm

# Keep the checks in this repository's workflow so the reusable publisher can
# run only after the module's rights gate and packaging lifecycle succeed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. X.Y.Z); defaults to the triggering vX.Y.Z tag"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test and packaging tools
        run: python -m pip install poetry pytest PyYAML black ruff
      - name: Install Quire and Quoin CLIs
        run: npm ci
      - name: Add engine CLIs to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install default Quire modules
        run: quoin module ensure-defaults
      - name: Check clause-set publication rights
        run: quire publish-check --module spec_clauses_us_health
      - name: Dry-run npm package lifecycle
        run: npm pack --dry-run --json

  publish:
    needs: gate
    uses: agent-ix/nodejs-actions/.github/workflows/release-npm-module.yml@main
    with:
      version: ${{ inputs.version }}
