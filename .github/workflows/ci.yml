name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test and packaging tools
        run: python -m pip install poetry pytest PyYAML black ruff
      - name: Install Quire and Quoin CLIs
        run: npm ci
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Install pinned Engineering Assurance CLI
        run: |
          cargo install \
            --locked \
            --features full \
            --bin engineering-assurance \
            --git https://github.com/agent-ix/engineering-assurance \
            --rev 1e16a8969aedec7366f165039740dfbbbbf66ccc
      - name: Add engine CLIs to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install default Quire modules
        run: quoin module ensure-defaults
      - name: Verify module, rights, catalog, and distribution contents
        run: pytest
      - name: Check Python style and compilation
        run: make lint
