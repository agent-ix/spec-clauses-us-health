name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test and packaging tools
        run: python -m pip install poetry pytest PyYAML black ruff
      - name: Install Quire and Quoin CLIs
        run: npm ci
      - name: Install Engineering Assurance release CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/agent-ix/engineering-assurance/releases/download/v0.10.1/engineering-assurance \
            --output /usr/local/bin/engineering-assurance
          chmod 0755 /usr/local/bin/engineering-assurance
      - name: Add engine CLIs to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install default Quire modules
        run: quoin module ensure-defaults
      - name: Install pinned NIST crosswalk module
        run: quoin module install github:agent-ix/spec-objects-security//spec_objects_security@v0.14.0
      - name: Verify module, rights, catalog, and distribution contents
        run: pytest
      - name: Check Python style and compilation
        run: make lint
