name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test and packaging tools
        run: python -m pip install poetry pytest PyYAML
      - name: Install Quire and Quoin CLIs
        run: npm ci
      - name: Install default Quire modules
        run: quoin module ensure-defaults
      - name: Verify module, rights, catalog, and distribution contents
        run: pytest
